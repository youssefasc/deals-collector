<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم — عروض متتفوتش</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--text:#eef1f6;--mute:#9aa3b2;--brand:#ff6a2b;--brand2:#ffb02e;--good:#2ecc71;--bad:#ff4d5e}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0f1115ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header img{width:38px;height:38px;border-radius:50%}header b{font-size:16px}header .sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
nav button.on{background:var(--text);color:#111;font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}.stat small{color:var(--mute);display:block;font-size:12px}.stat b{font-size:22px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
textarea{min-height:80px}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font:inherit;font-size:13px;cursor:pointer;font-weight:700}
.btn.p{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#111;border:0}.btn.r{background:#2c1418;color:#ff9aa6;border-color:#5a2a34}.btn.g{background:#11291b;color:#7ff0a7;border-color:#1f5a3a}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.sw:last-child{border:0}
.tog{position:relative;width:46px;height:26px;flex:0 0 auto}.tog input{opacity:0;width:0;height:0}.tog span{position:absolute;inset:0;background:#3a404c;border-radius:99px;transition:.2s}.tog span:before{content:'';position:absolute;width:20px;height:20px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s}
.tog input:checked+span{background:var(--good)}.tog input:checked+span:before{transform:translateX(-20px)}
.prod{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.prod img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px}
.prod .t{font-size:13px;line-height:1.5}.prod .m{color:var(--mute);font-size:12px}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--card2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:50}
#login{max-width:360px;margin:15vh auto;text-align:center}
.mute{color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
</style>
</head>

<script>

const LOOPS=[['deals','صفحة عروض أمازون (Today\'s Deals)'],['hot','الفحص السريع لصفحة العروض (كل 10 ثواني)'],['search','بحث الخصومات (سوبرماركت، منظفات، أطفال، جمال)'],['nodes','كل منتجات الأقسام (موبايلات، لابتوب، شاشات، بقالة…)'],['top','الفحص المتكرر للأكثر مبيعاً'],['now','أمازون ناو'],['resale','أمازون مستعمل'],['coupons','جمع كوبونات أمازون (اللي ظاهرة على المنتجات)']];
let TOKEN='';try{TOKEN=localStorage.getItem('adm')||''}catch(e){}

const $=id=>document.getElementById(id);

const fmt=n=>n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
async function rpc(fn,body){const r=await fetch(SB+'rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(Object.assign({token:TOKEN},body||{}))});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function get(path){const r=await fetch(SB+path,{headers:H});return r.json()}
async function setCfg(k,v){await rpc('admin_set_config',{k,v});SITE[k]=v;toast('اتحفظ ✅')}
async function loadSite(){SITE={};(await get('site_config?select=key,value')).forEach(r=>SITE[r.key]=r.value)}
function tog(id,on){return `<label class="tog"><input type="checkbox" id="${id}" ${on?'checked':''}><span></span></label>`}

async function login(){
  TOKEN=$('pw').value.trim()||TOKEN;
  let ok=false;try{ok=await rpc('admin_check')}catch(e){}
  if(!ok){$('lerr').textContent='كلمة السر غلط';TOKEN='';try{localStorage.removeItem('adm')}catch(e){};return}
  try{localStorage.setItem('adm',TOKEN)}catch(e){}
  $('login').hidden=true;$('app').hidden=false;await loadSite();show('dash');
}
$('loginBtn').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('logout').onclick=()=>{try{localStorage.removeItem('adm')}catch(e){}location.reload()};

const TABS=[['dash','📊 الإحصائيات'],['content','✍️ محتوى الموقع'],['stores','🏪 المتاجر'],['cats','🗂 الأقسام'],['products','📦 المنتجات'],['collector','⚙️ الجامع'],['coupons','🎟 الكوبونات'],['tools','🛠 أدوات متقدمة']];
function show(t){clearInterval(timer);$('tabs').innerHTML=TABS.map(([k,n])=>`<button class="${k===t?'on':''}" data-t="${k}">${n}</button>`).join('');
  $('tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)};VIEWS[t]();scrollTo(0,0)}

function agoS(t){const x=Date.now()/1000-t;return x<60?'من ثواني':x<3600?'من '+Math.round(x/60)+' د':x<86400?'من '+Math.round(x/3600)+' س':'من '+Math.round(x/86400)+' يوم'}
function ago(t){return agoS(new Date(t).getTime()/1000)}
const VIEWS={
async dash(){
  const draw=async()=>{let s;try{s=await rpc('admin_stats')}catch(e){if(!$('view').innerHTML.trim())$('view').innerHTML='<div class="card">بيحمّل…</div>';return}
    const c=s.collector||{};const age=s.collector_at?Math.round((Date.now()-new Date(s.collector_at))/1000):null;

      <div class="grid">
      <div class="stat"><small>طلبات من آخر تشغيل</small><b>${fmt(c.requests)}</b></div>

      <div class="stat"><small>آخر تحديث</small><b>${age===null?'—':age+' ث'}</b></div></div></div>
    <div class="card"><h3>المنتجات</h3><div class="grid">

    <div class="card"><h3>⚡ جامع نون مينتس (مستقل)</h3>${(()=>{const m=s.minutes_status;if(!m)return '<p class="mute">لسه مفيش تقرير — الجامع بيبدأ.</p>';const age=Math.round((Date.now()/1000-m._at)/60);const fm=x=>x==null?'—':(x<120?x+' ث':Math.round(x/60)+' د');return `<p class="mute">آخر تقرير من ${age} د ${age>5?'⚠️ الجامع مش بيبعت تقارير':'🟢 شغال'} · المنطقة: ${m.region}</p><div class="grid">
<div><b>${m.pages}</b><br><small>صفحة في الطابور</small></div><div><b>${m.priority_pages}</b><br><small>صفحة أولوية (خصومات)</small></div>
<div><b>${fm(m.prio_cycle_secs)}</b><br><small>دورة الأولوية الفعلية (الهدف ${m.target_priority_secs} ث)</small></div><div><b>${fm(m.full_cycle_secs)}</b><br><small>دورة الكتالوج كله</small></div>
<div><b>${m.new_products}</b><br><small>منتج جديد</small></div><div><b>${m.price_changes}</b><br><small>تغيير سعر</small></div>
<div><b>${m.discount_ended}</b><br><small>خصم انتهى</small></div><div><b>${m.out_of_stock} / ${m.back_in_stock}</b><br><small>نفد / رجع</small></div>
<div><b>${m.requests}</b><br><small>طلب (أخطاء ${m.errors})</small></div><div><b>×${m.slowdown}</b><br><small>تهدئة تلقائية</small></div></div>`})()}</div>
    <div class="card"><h3>☁️ الجامع السحابي (مجاني — شغال كل دقيقة)</h3><p class="mute">بيشتغل على Supabase من غير أي جهاز. لو متجر فشل بيستنى ويرجع لوحده، والباقي مكمّل.</p><div class="grid">${(s.cloud_jobs||[]).map(j=>{const now=Date.now();const ok=j.last_ok?Date.parse(j.last_ok):0;const nxt=Date.parse(j.next_run);

        return `<div class="stat"><small>${esc((STORES.find(x=>x[0]===j.store)||[,j.store])[1])}</small><b><span class="tag" style="background:${st[1]};color:${st[2]}">${st[0]}</span></b>

          <small>${nxt>now?'اللفة الجاية: '+new Date(nxt).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'شغال دلوقتي'} · كل ${j.interval_min} د</small>
          ${j.fail_count>0&&j.last_err?`<small style="color:#ff9aa6">آخر خطأ: ${esc(j.last_err.slice(0,90))}</small>`:''}</div>`}).join('')}</div></div>
    <div class="card"><h3>🖥 متاجر المتصفح (GitHub — ٣ مرات في اليوم)</h3><p class="mute">2B ودبي فون وكارفور وفودافون وأورنج${s.collections_at?' · آخر تحديث لمجموعات العروض '+ago(s.collections_at):''}</p><div class="grid">${(()=>{const H=s.health||{};const off=s.config||{};const now=Date.now()/1000;
      return STORES.filter(x=>H[x[0]]||!off['off_store_'+x[0]]&&['amazon','amazon_now','amazon_resale','carrefour','btech','dream2000','dubaiphone','talabat','2b','orange'].includes(x[0])).map(([k,n])=>{const h=H[k]||{};const stopped=off['off_store_'+k];
        const st=stopped?['⏸ موقوف من اللوحة','#2a2a2a','#bbb']:h.status==='backoff'?['⏳ مستني يجرب تاني','#2c2414','#ffd08a']:h.status==='blocked'?['⛔ المتجر رافض (403)','#2c1418','#ff9aa6']:h.status==='error'?['⚠️ خطأ','#2c2414','#ffd08a']:h.last_ok&&now-h.last_ok<1800?['● شغّال','#11291b','#7ff0a7']:['… مستني دورته','#1d2230','#9fb3ff'];
        const tot=(h.ok||0)+(h.fail||0);const rate=tot?Math.round((h.ok||0)/tot*100):null;

    a=a.filter(f=>f.url&&!/PUT_/.test(f.url));const nc=Object.assign({},window.__ccfg||{},{feeds:a});await rpc('admin_set_collector',{cfg:nc});window.__ccfg=nc;$('fMsg').textContent='✅ اتحفظ '+a.length+' مصدر — الجامع هيقراهم خلال دقيقة (القوالب اللي لسه فيها PUT_ اتشالت)'};
  $('iGo').onclick=async()=>{const f=$('iFile').files[0];if(!f){toast('اختار ملف');return}const store=$('iStore').value;const txt=await f.text();let rows=[];
    try{if(/^\s*[\[{]/.test(txt)){const j=JSON.parse(txt);rows=Array.isArray(j)?j:(j.products||j.items||[])}else{const lines=txt.split(/\r?\n/).filter(Boolean);const sp=l=>{const o=[];let c='',q=false;for(const ch of l){if(ch=='"'){q=!q}else if(ch==','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())};const hd=sp(lines[0]);rows=lines.slice(1).map(l=>{const v=sp(l);const o={};hd.forEach((h,i)=>o[h]=v[i]);return o})}}catch(e){$('iProg').textContent='❌ مقدرتش أقرا الملف';return}
    const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.]/g,''));return isNaN(n)?null:n};
    const items=rows.map(r=>{const p=num(r.price),w=num(r.list_price);if(!r.pid||!p)return null;const was=w&&w>p?w:null;return{store,pid:String(r.pid),title:String(r.title||'').slice(0,300),image:r.image||null,url:r.url||null,price:p,list_price:was,discount_pct:was?Math.round((1-p/was)*100):null,category:r.category||'other',src_category:'import:'+store,in_stock:!/^(0|false|no|out)/i.test(String(r.in_stock??'1'))}}).filter(Boolean);
    let done=0;for(let i=0;i<items.length;i+=500){await rpc('admin_import_products',{items:items.slice(i,i+500)});done+=Math.min(500,items.length-i);$('iProg').textContent='بيستورد… '+done+' / '+items.length}
    $('iProg').textContent='✅ اتستورد '+done+' منتج من '+rows.length+' سطر (السطور الناقصة pid أو price اتجاهلت)'};
  $('dGo').onclick=async()=>{const k=$('dStore').value,n=$('dStore').selectedOptions[0].text;
    if(prompt(`لتأكيد مسح كل منتجات "${n}" نهائياً اكتب اسم المتجر:`)!==n)return toast('اتلغى');
    let total=0,c;do{c=await rpc('admin_delete_store',{st:k});total+=c;$('dProg').textContent='اتمسح '+total+' منتج…'}while(c>0);toast('اتمسح '+total+' منتج ✅')};
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{const f={};if($('bStore').value)f.store=$('bStore').value;if($('bCat').value)f.category=$('bCat').value;if($('bWord').value.trim())f.word=$('bWord').value.trim();
    if(!Object.keys(f).length&&!confirm('مفيش فلتر — ده هيطبق على كل المنتجات. متأكد؟'))return;
    if(b.dataset.b==='del'){if(!confirm('مسح كل المنتجات المطابقة نهائياً؟'))return;let t=0,c;do{c=await rpc('admin_bulk_delete',{filt:f});t+=c;toast('اتمسح '+t+'…')}while(c>0);return toast('اتمسح '+t+' منتج ✅')}
    const p={hide:{hidden:true},show:{hidden:false},reset:{reset_drops:true}}[b.dataset.b];const n=await rpc('admin_bulk',{filt:f,patch:p});toast('اتطبق على '+n+' منتج ✅')});
  $('bwSave').onclick=async()=>{const ws=$('bw').value.split('\n').map(x=>x.trim()).filter(x=>x.length>1);await setCfg('blocked_words',ws);let tot=0;for(const w of ws){let c;do{c=await rpc('admin_bulk_delete',{filt:{word:w}});tot+=c}while(c>0)}toast('اتحفظ واتمسح '+tot+' منتج ✅')};
  $('dispSave').onclick=async()=>{await setCfg('min_discount',+$('minD').value||0);await setCfg('default_sort',$('defS').value)};
  $('mSave').onclick=()=>setCfg('maintenance',{on:$('mOn').checked,text:$('mText').value.trim()||null});
  $('pGo').onclick=async()=>{const d=+$('pDays').value;if(!confirm('مسح تاريخ الأسعار الأقدم من '+d+' يوم؟'))return;const n=await rpc('admin_prune_history',{days:d});toast('اتمسح '+n+' سطر')};
  $('npwGo').onclick=async()=>{const p=$('npw').value;if(p.length<8)return toast('8 حروف على الأقل');await rpc('admin_change_password',{newpw:p});TOKEN=p;try{localStorage.setItem('adm',p)}catch(e){}toast('اتغيرت ✅')};
},
async collector(){
  const s=await rpc('admin_stats');const c=s.config||{};
  $('view').innerHTML=`<div class="card"><h3>⚙️ التحكم في الجامع</h3>
    <div class="sw"><b>⏸ إيقاف الجامع بالكامل</b>${tog('paused',c.paused)}</div>
    <p class="mute">التغييرات بتوصل للجامع خلال 30 ثانية.</p></div>
  <div class="card"><h3>المصادر</h3>${LOOPS.map(([k,n])=>`<div class="sw"><span>${n}</span>${tog('loop_'+k,!c['off_'+k])}</div>`).join('')}</div>
  <div class="card"><h3>السرعة</h3><p class="mute">الأرقام دي ثواني انتظار بين كل طلب والتاني. أقل = أسرع بس احتمال الحظر من أمازون أعلى.</p>
    <div class="grid">
      <div><label>صفحة العروض</label><input id="sweep_delay" type="number" step="0.1" min="0.2" value="${c.sweep_delay??0.6}"></div>
      <div><label>بحث الخصومات</label><input id="search_delay" type="number" step="0.1" min="0.3" value="${c.search_delay??1}"></div>
      <div><label>كل منتجات الأقسام</label><input id="node_delay" type="number" step="0.1" min="0.3" value="${c.node_delay??2}"></div>
      <div><label>الأكثر مبيعاً</label><input id="top_delay" type="number" step="0.1" min="0.3" value="${c.top_delay??1.5}"></div>
      <div><label>عدد صفحات الأكثر مبيعاً</label><input id="top_pages" type="number" min="1" max="20" value="${c.top_pages??4}"></div>
    </div></div>
  <button class="btn p" id="saveX" style="width:100%;padding:14px">حفظ إعدادات الجامع</button>`;
  $('saveX').onclick=async()=>{const out={paused:$('paused').checked};Object.keys(c).filter(k=>k.startsWith('off_store_')).forEach(k=>out[k]=c[k]);LOOPS.forEach(([k])=>{if(!$('loop_'+k).checked)out['off_'+k]=true});
    ['sweep_delay','search_delay','node_delay','top_delay','top_pages'].forEach(k=>{const v=parseFloat($(k).value);if(!isNaN(v))out[k]=v});
    await rpc('admin_set_collector',{cfg:out});toast('اتحفظ — هيتطبق خلال 30 ثانية ✅')};
}};
if(TOKEN)login();
</script>
</body>
