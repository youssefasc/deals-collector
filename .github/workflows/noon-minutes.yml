name: جامع نون مينتس (مستقل)

# جامع مستقل تماماً: ملفه لوحده وتشغيلته لوحده — لو وقف أو حصلت فيه مشكلة مش بيأثر على أي جامع تاني.
# بيشتغل على طول: كل تشغيلة ~٥:٥٠ ساعة، وفي آخرها بتشغّل اللي بعدها فوراً (الجدولة احتياطي).
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      minutes: {description: 'مدة التشغيل بالدقايق', default: '350'}

concurrency:
  group: noon-minutes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      SUPABASE_URL: https://unwzvhdwxmlmknvgvrhp.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVud3p2aGR3eG1sbWtudmd2cmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMjQ5MzUsImV4cCI6MjExMDYwMDkzNX0.g_500nSaAP5lF6N69ofsvozust1BpzbBU7kZXtooAyM
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q httpx
      - name: Run noon Minutes collector
        run: |
          M="${{ github.event.inputs.minutes || '350' }}"
          RUN_SECONDS=$((M*60)) python minutes_collector.py

  next:
    needs: collect
    if: always() && github.event.inputs.minutes != '10'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run noon-minutes.yml -R ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}
