name: اختبار برنامج الويندوز

# بيشغّل deploy/windows/install.ps1 على جهاز Windows نضيف بنفس خطوات كمبيوترك،
# ويتأكد من وضع الدفعات (يشتغل شوية ويقف ويرجع لوحده).
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install (same script as the PC)
        shell: powershell
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GH_READ: ${{ github.token }}
        run: |
          & .\deploy\windows\install.ps1 -Token $env:INGEST_TOKEN -GitToken $env:GH_READ -NoTask
          # اختبار سريع: دفعة دقيقتين كل ٤ دقايق
          $e = "$env:LOCALAPPDATA\OroodCollector\collector.env"
          (Get-Content $e) -replace '^RUN_MINUTES=.*','RUN_MINUTES=2' -replace '^EVERY_HOURS=.*','EVERY_HOURS=0.0667' | Set-Content -Encoding UTF8 $e
          Get-Content $e | Select-String 'ONLY_STORES|RUN_MINUTES|EVERY_HOURS'
          Start-Process powershell -ArgumentList '-NoProfile','-WindowStyle','Hidden','-ExecutionPolicy','Bypass','-File',"$env:LOCALAPPDATA\OroodCollector\run-loop.ps1"
      - name: Batch mode works (runs, stops, starts again)
        shell: powershell
        run: |
          Start-Sleep 60
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*main.py*' }).Count
          "during batch: $running collector processes"
          Start-Sleep 110
          $stopped = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*main.py*' }).Count
          "between batches: $stopped collector processes"
          Start-Sleep 130
          $again = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*main.py*' }).Count
          "next batch: $again collector processes"
          Get-Content "$env:LOCALAPPDATA\OroodCollector\collector.log" -Tail 40
          if ($running -lt 1) { throw "collector did not start" }
          if ($stopped -ne 0) { throw "collector did not stop between batches" }
          if ($again -lt 1) { throw "next batch did not start" }
