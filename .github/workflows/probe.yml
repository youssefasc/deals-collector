name: فحص مصدر بيانات (قراءة بس)
on:
  workflow_dispatch:
    inputs:
      urls: {required: true}
      grep: {default: ''}
      bytes: {default: '3000'}
      offset: {default: '0'}
      hdrs: {default: ''}
      script: {default: 'tools/probe.py'}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ${{ github.event.inputs.script }} ${{ github.event.inputs.script != 'tools/probe.py' && github.event.inputs.urls || '' }}
        env:
          URLS: ${{ github.event.inputs.urls }}
          GREP: ${{ github.event.inputs.grep }}
          BYTES: ${{ github.event.inputs.bytes }}
          OFF: ${{ github.event.inputs.offset }}
          HDRS: ${{ github.event.inputs.hdrs }}
