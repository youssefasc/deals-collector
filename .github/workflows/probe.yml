name: فحص مصدر بيانات (قراءة بس)
on:
  workflow_dispatch:
    inputs:
      urls: {required: true}
      grep: {default: ''}
      bytes: {default: '3000'}
      off: {default: '0'}
      hdrs: {default: ''}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe.py
        env:
          URLS: ${{ github.event.inputs.urls }}
          GREP: ${{ github.event.inputs.grep }}
          BYTES: ${{ github.event.inputs.bytes }}
          OFF: ${{ github.event.inputs.off }}
          HDRS: ${{ github.event.inputs.hdrs }}
