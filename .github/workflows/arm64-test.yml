name: اختبار ARM64 (نفس معالج سيرفر Oracle المجاني)

# بيبني صورة الجامع لمعالج ARM64 (Ampere A1 بتاع Oracle) ويشغّلها فعلياً عشان نتأكد إنها شغالة
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'مدة التشغيل بالدقايق'
        default: '15'

jobs:
  arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build arm64 image
        run: docker buildx build --platform linux/arm64 -t collector:arm64 --load .
      - name: Check image architecture
        run: docker image inspect collector:arm64 --format '{{.Architecture}}'
      - name: Run collector on arm64
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          M="${{ github.event.inputs.minutes || '15' }}"
          K=$(grep -o 'SUPABASE_KEY: .*' .github/workflows/collector.yml | cut -d' ' -f2)
          docker run --rm --platform linux/arm64 --memory=4g \
            -e SUPABASE_URL=https://unwzvhdwxmlmknvgvrhp.supabase.co -e SUPABASE_KEY="$K" -e INGEST_TOKEN \
            -e AMAZON_MAIN=0 -e DB_CONCURRENCY=1 -e SWEEP_WORKERS=2 -e COLLECTOR_TAG=arm64-test \
            collector:arm64 timeout "$((M*60))" python -c "import platform;print('ARCH',platform.machine());import runpy;runpy.run_path('main.py',run_name='__main__')" || [ $? -eq 124 ]
