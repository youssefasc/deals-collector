name: جامع متاجر المتصفح (مجاني)

# الجامع الأساسي سحابي (Supabase Edge Function) وشغال كل دقيقة.
# ده بيجمع المتاجر اللي محتاجة متصفح كامل (كارفور، فودافون، أورنج) على طول من غير توقف:
# كل متجر في تشغيلة لوحده، كل تشغيلة ~٥:٥٠ ساعة، وفي آخرها بتشغّل اللي بعدها على طول (الجدولة احتياطي بس).
# 2B ودبي فون بيرفضوا سيرفرات GitHub، فبيجمعهم برنامج الويندوز (deploy/windows).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'مدة التشغيل بالدقايق'
        default: '350'

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        store: [carrefour, vodafone, orange]
    concurrency:
      group: collector-${{ matrix.store }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 358
    container: mcr.microsoft.com/playwright/python:v1.40.0-jammy
    env:
      SUPABASE_URL: https://unwzvhdwxmlmknvgvrhp.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVud3p2aGR3eG1sbWtudmd2cmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMjQ5MzUsImV4cCI6MjExMDYwMDkzNX0.g_500nSaAP5lF6N69ofsvozust1BpzbBU7kZXtooAyM
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      AMAZON_MAIN: ${{ matrix.store == 'amazon' && '1' || '0' }}
      DB_CONCURRENCY: '1'
      SWEEP_WORKERS: '2'
      ONLY_STORES: ${{ matrix.store }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run collector
        run: |
          if [ -z "$INGEST_TOKEN" ]; then echo "::error::ضيف INGEST_TOKEN في Settings > Secrets > Actions"; exit 1; fi
          M="${{ github.event.inputs.minutes || '350' }}"
          timeout "$((M*60))" python main.py || [ $? -eq 124 ]

  next:
    # أول ما التشغيلة تخلص، بتشغّل اللي بعدها فوراً (من غير ما نستنى جدولة GitHub اللي بتتأخر ساعات)
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run collector.yml -R ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}

