name: جامع متاجر المتصفح (مجاني)

# الجامع الأساسي سحابي (Supabase Edge Function) وشغال كل دقيقة.
# ده بيجمع بس المتاجر اللي محتاجة متصفح كامل (2B، دبي فون، كارفور، فودافون، أورنج) ٣ مرات في اليوم.
on:
  schedule:
    - cron: '17 4,12,20 * * *'   # ٦ الصبح و٢ الضهر و١٠ بالليل بتوقيت مصر
  workflow_dispatch:
    inputs:
      minutes:
        description: 'مدة التشغيل بالدقايق'
        default: '15'

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright/python:v1.40.0-jammy
    env:
      SUPABASE_URL: https://unwzvhdwxmlmknvgvrhp.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVud3p2aGR3eG1sbWtudmd2cmhwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwMjQ5MzUsImV4cCI6MjExMDYwMDkzNX0.g_500nSaAP5lF6N69ofsvozust1BpzbBU7kZXtooAyM
      INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
      AMAZON_MAIN: '0'
      DB_CONCURRENCY: '1'
      SWEEP_WORKERS: '2'
      ONLY_STORES: '2b,dubaiphone,carrefour,vodafone,orange'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the PC collector is running
        id: gate
        run: |
          # لو أداة الكمبيوتر بعتت نبضة في آخر ٢٠ دقيقة يبقى هي اللي بتجمع المتاجر دي — مش محتاجين نشغّل هنا
          AT=$(curl -s "$SUPABASE_URL/rest/v1/rpc/collector_get_state" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
               -H 'Content-Type: application/json' -d "{\"token\":\"$INGEST_TOKEN\",\"k\":\"health\"}" | python3 -c 'import sys,json;d=json.load(sys.stdin) or {};print(int(d.get("_at",0)))' 2>/dev/null || echo 0)
          AGE=$(( $(date +%s) - AT ))
          echo "last PC heartbeat ${AGE}s ago"
          if [ "${{ github.event_name }}" = "schedule" ] && [ $AGE -lt 1200 ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - name: Install
        if: steps.gate.outputs.skip != '1'
        run: pip install --no-cache-dir -r requirements.txt
      - name: Run collector
        if: steps.gate.outputs.skip != '1'
        run: |
          if [ -z "$INGEST_TOKEN" ]; then echo "::error::ضيف INGEST_TOKEN في Settings > Secrets > Actions"; exit 1; fi
          M="${{ github.event.inputs.minutes || '15' }}"
          timeout "$((M*60))" python main.py || [ $? -eq 124 ]
